{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUME Skin</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="body">
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">𖥸</div>
            <h2>LUME Skin</h2>
        </div>
        <nav class="menu">
            <a href="{% url 'dashboard' %}" class="menu-item active">Dashboard</a>
            <a href="{% url ' ' %}" class="menu-item">Scanner de Pele por IA</a> 
            <a href="{% url ' ' %}" class="menu-item">Recomendações</a>
            <a href="{% url ' ' %}" class="menu-item">Especialistas</a>
        </nav>
        <div class="sidebar-footer">
            <a href="{% url ' ' %}" class="menu-item"><i class="fa-jelly fa-regular fa-address-card"></i>Perfil e configurações</a>
        </div>
    </aside>

    <main class="main content">
        <header class="topbar">
            <div class="perfil">
                <span class="nome-usuario">{{ request.user.nome_usuario|default:'Usuário' }}</span>
            </div>
        </header>
        
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
