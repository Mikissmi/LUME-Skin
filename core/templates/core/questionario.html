{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário | LUME Skin</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}?v=2">
</head>
<body class="app-body">
    <main class="main content">
        <div class="pagina-questionario">
            <h2>Questionário Dermatológico</h2>
            <p>Responda com sinceridade para personalizarmos sua rotina.</p>
            
          <form method="POST" action="{% url 'questionario' %}" enctype="multipart/form-data" class="questionario-form">
                {% csrf_token %}

                <div class="form-bloco">
                    <label>1. Qual a sua idade?</label>
                    <input type="number" name="idade" min="10" max="120" required>
                </div>

                <div class="form-bloco">
                    <label>2. Qual o seu tipo de pele predominante?</label>
                    <select name="tipo_pele" required>
                        <option value="oleosa">Oleosa (Brilho excessivo e poros abertos)</option>
                        <option value="seca">Seca (Descama ou repuxa)</option>
                        <option value="mista">Mista (Oleosa na zona T, seca nas bochechas)</option>
                        <option value="normal">Normal (Equilibrada)</option>
                    </select>
                    <label>2.1. Foi diagnosticado por um dermatologista ou uma análise pessoal?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="diagnostico" value="0"> Diagnosticado por um dermatologista</label>
                        <label><input type="radio" name="diagnostico" value="1"> Análise pessoal</label>
                    </div>
                </div>

                <div class="form-bloco">
                    <label>3. Qual é o seu principal objetivo com o skincare?</label>
                        <select name="objetivo" required>
                            <option value="hidratar">Hidratar</option>
                            <option value="controlar oleosidade">Controlar Oleosidade</option>
                            <option value="reduzir manchas">Reduzir Manchas</option>
                            <option value="anti-idade">Anti-idade</option>
                            <option value="reduzir acne">Reduzir Acne</option>
                            <option value="melhorar textura">Melhorar Textura</option>
                            <option value="outro">Outro <input type="text" name="objetivo_outro" placeholder="Especifique..."></option>
                        </select>
                    </div>

                <div class="form-bloco">
                    <label>4. Você tem histórico de alergias na pele?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="alergias" value="0"> Não, nunca tive</label>
                        <label><input type="radio" name="alergias" value="1"> Sim</label>
                    </div>
                    <input type="text" name="descricaoalergia" placeholder="Descreva as alergias...">
                </div>

                <div class="form-bloco">
                    <label>5. Você utiliza maquiagem diariamente?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="maquiagem" value="0"> Não</label>
                        <label><input type="radio" name="maquiagem" value="1"> Sim</label>
                    </div>
                </div>

                <div class="form-bloco">
                    <label>6. Como sua pele reage ao sol?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="reacao_sol" value="0"> Sempre queima, nunca bronzeia</label>
                        <label><input type="radio" name="reacao_sol" value="1"> Sempre queima, bronzeia minimamente</label>
                        <label><input type="radio" name="reacao_sol" value="2"> Queima moderadamente, bronzeia gradualmente</label>
                        <label><input type="radio" name="reacao_sol" value="3"> Raramente queima, bronzeia com facilidade</label>
                        <label><input type="radio" name="reacao_sol" value="4"> Quase nunca queima, bronzeia muito facilmente</label>
                    </div>
                </div>

               <div class="form-bloco">
                 <label>7. Em média, quantas horas você dorme por noite?</label>
                  <select name="sono_horas" required>
                  <option value="curto">Menos de 5 horas</option>
                  <option value="reduzido">5 a 7 horas</option>
                  <option value="adequado">7 a 8 horas</option>
                  <option value="longo">Mais de 9 horas</option>
                 </select>
             </div>

                <div class="form-bloco">
                    <label>8. Com que frequência você usa protetor solar no rosto?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="protetor_solar" value="0"> Nunca ou raramente</label>
                        <label><input type="radio" name="protetor_solar" value="1"> Às vezes</label>
                        <label><input type="radio" name="protetor_solar" value="2"> Todos os dias</label>
                    </div>
                </div>

                  <div class="form-bloco">
                   <label>9. Com que frequência você pratica atividade física?</label>
                   <select name="exercicio_frequencia" required>
                    <option value="nunca">Nunca ou raramente</option>
                      <option value="1-2x">1 a 2 vezes por semana</option>
                    <option value="3-4x">3 a 4 vezes por semana</option>
                    <option value="5x+">5 ou mais vezes por semana</option>
                  </select>
                 </div>

                   <div class="form-bloco">
                    <label>10. Você prefere produtos à base de gel ou creme?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="base_produto" value="gel"> Gel</label>
                        <label><input type="radio" name="base_produto" value="creme"> Creme</label>
                        <label><input type="radio" name="base_produto" value="gel"> Gel-creme</label>
                    </div>
                </div>

                    <div class="form-bloco">
                        <label>11. Deseja realizar um escaneamento facial com IA para uma analise mais precisa? (Opcional)</label>
                        <div class="radio-group" style="margin-bottom: 15px;">
                            <label><input type="radio" name="quer_escanear" value="sim" id="scan-sim" onclick="toggleUploadField()"> Sim, quero escanear minha pele</label>
                            <label><input type="radio" name="quer_escanear" value="nao" id="scan-nao" checked onclick="toggleUploadField()"> Não, apenas responder o questionário</label>
                            <p class="termo-scanner">Ao continuar, você concorda com nossos <a href="#">Termos de Serviço</a> e <a href="#">Política de Privacidade</a>.</p>
                        </div>

                        <div id="bloco-upload-foto" style="display: none; padding: 10px; border: 1px dashed #ccc; border-radius: 8px; background-color: #f9f9f9;">
                            <label style="font-size: 0.95rem; color: #59465f;">Envie uma foto clara do seu rosto de frente:</label>
                            <input type="file" name="foto_rosto" accept="image/*" id="input-foto">
                        </div>
                    </div>

                    <script>
                    function toggleUploadField() {
                        const scanSim = document.getElementById('scan-sim').checked;
                        const blocoUpload = document.getElementById('bloco-upload-foto');
                        const inputFoto = document.getElementById('input-foto');

                        if (scanSim) {
                            blocoUpload.style.display = 'block';
                            inputFoto.required = true;
                        } else {
                            blocoUpload.style.display = 'none';
                            inputFoto.required = false;
                            inputFoto.value = '';
                        }
                    }
                    </script>

                <button type="submit" class="btn">Salvar Perfil e Ver Resultados</button>
            </form>
        </div>
    </main>
</body>
</html>
